name: Capability proposal
description: Propose an evidence-backed workflow or genre improvement
title: "[proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the concrete task and current failure, not only a desired feature name.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence
      description: What fixture, automated assertion, or task artifact would prove the change works?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: Note skill routing, scripts, schemas, references, compatibility, and failure behavior.
